<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Mode - Tag Web</title>
    <style>
        body {
            background-color: #050814;
            color: #d6eef1;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }

        .error-code {
            color: #ff4d4d;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            color: #64ffda;
            font-size: 28px;
        }

        p {
            max-width: 500px;
            line-height: 1.6;
            color: #8892b0;
        }

        .code-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(100, 255, 218, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            color: #64ffda;
        }
    </style>
</head>

<body>

    <div class="error-code">📡 status_code: 404_NET_DISCONNECTED</div>
    <h1>Oops! Elements Not Synced</h1>
    <p>Hey dev! You are trying to access a module that hasn't been cached in your local browser memory yet.</p>

    <div class="code-box">
        const connection = false;<br>
        if (!connection) {<br>
        &nbsp;&nbsp;return "Please turn on your internet once to unlock this node permanently! ⚡";<br>
        }
    </div>

</body>

</html>
